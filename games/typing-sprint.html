<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Sprint | Just Because Games</title><link rel="canonical" href="https://just-because-games.netlify.app/games/typing-sprint.html"><link rel="icon" href="../favicon.svg"><script src="../js/theme.js"></script><link rel="stylesheet" href="../css/style.css"><style>
.typing-card{max-width:820px;margin:32px auto;padding:28px;border:1px solid var(--border);border-radius:18px;background:var(--surface)}
.typing-sentence{min-height:112px;padding:18px;border:1px solid var(--border);border-radius:12px;background:var(--surface-soft);font:600 20px/1.55 'Space Grotesk',sans-serif}.typing-sentence .good{color:#16a34a}.typing-sentence .bad{color:#dc2626;text-decoration:underline}.typing-input{width:100%;min-height:74px;margin-top:12px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--control-bg);color:var(--text);font-size:18px}
.typing-stats{display:flex;gap:18px;margin:14px 0}.typing-duration{display:flex;gap:8px;margin:14px 0}.typing-duration button{padding:9px 13px;border:1px solid var(--border);border-radius:999px;background:var(--surface-soft);color:var(--text)}.typing-duration button.is-selected{background:#ff6b00;border-color:#ff6b00;color:#111827}
